# Public natural-language task configuration. Local copy is never release-managed.
schema_version: '1.0'
study:
  design: user_defined
  seed: 2024
inputs: {}
runtime:
  workers: 2
  r_workers: 1
  rscript: Rscript
  r_library_paths: []
  retries: 3
  llm_enabled: false
llm:
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0
  max_tokens: 32000
  timeout_seconds: 120
  max_retries: 2
  max_schema_retries: 2
  token_budget: 500000
  cache: true
reasoning:
  max_iterations: 2
  max_reasoning_iterations: 2
analysis:
  # Pathway-scoring protocol. These values are frozen into the approved plan; the
  # model never chooses the methods or the significance threshold. A threshold
  # quoted verbatim in the request overrides adjusted_p_max for that task.
  pathway_scoring:
    trigger: [gsva, ssgsea, plage, zscore, 通路评分, 通路得分, 基因集评分, pathway score, gene set score]
    methods: [ssgsea, plage, zscore, gsva]
    adjusted_p_max: 0.05
    consensus_min_methods: 2
    min_size: 5
    max_size: 500
    seed: 2024
knowledge:
  shared_enabled: true
  # shared_root: optional explicit local curated-library directory
research:
  literature:
    providers: [pubmed, europepmc]
    offline: false
    refresh: false
    fetch_full_text: false
    max_queries: 8
    max_records: 10
    timeout: 25
    retries: 2
distribution:
  mode: native_collaborator_test
  credential_storage: system
  supported_entry: natural_language_tasks
  scrna_included: false
