name: Debug R user library

on: push

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Probe R with a temporary user library
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Rlib"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "user library: $dir"
          $env:R_LIBS_USER = $dir
          Rscript --vanilla -e 'cat("R_VERSION=",as.character(getRversion()),"\n",sep="")'
          Rscript --vanilla -e 'extra <- unlist(strsplit(Sys.getenv("R_LIBS_USER"), .Platform$path.sep, fixed=TRUE)); extra <- path.expand(extra[nzchar(extra)]); extra <- extra[dir.exists(extra)]; .libPaths(unique(c(extra,.libPaths()))); cat("R_VERSION=",as.character(getRversion()),"\n",sep="")'
          Rscript --vanilla -e 'print(Sys.getenv("R_LIBS_USER")); print(.libPaths()); cat("OK\n")'
