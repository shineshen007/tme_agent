name: Debug R user library

on: push

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Probe R with a temporary user library
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Rlib"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Write-Host "user library: $dir"
          $env:R_LIBS_USER = $dir
          $private = Join-Path $env:RUNNER_TEMP "project\.runtime\r-library"
          $env:PRIVATE_LIB = $private
          Rscript --vanilla -e 'cat("R_VERSION=",as.character(getRversion()),"\n",sep="")'
          Rscript --vanilla -e 'extra <- unlist(strsplit(Sys.getenv("R_LIBS_USER"), .Platform$path.sep, fixed=TRUE)); extra <- path.expand(extra[nzchar(extra)]); extra <- extra[dir.exists(extra)]; .libPaths(unique(c(extra,.libPaths()))); cat("R_VERSION=",as.character(getRversion()),"\n",sep="")'
          Rscript --vanilla -e 'extra <- unlist(strsplit(Sys.getenv("R_LIBS_USER"), .Platform$path.sep, fixed=TRUE)); extra <- path.expand(extra[nzchar(extra)]); extra <- extra[dir.exists(extra)]; .libPaths(unique(c(extra,.libPaths()))); lib <- Sys.getenv("PRIVATE_LIB"); if(dir.exists(lib)) .libPaths(c(lib,.libPaths())); cat("R_VERSION=",as.character(getRversion()),"\n",sep=""); cat("R_HOME=",R.home(),"\n",sep=""); for(p in commandArgs(TRUE)) { ok <- requireNamespace(p,quietly=TRUE); cat(p,if(ok) as.character(packageVersion(p)) else "missing",if(ok) find.package(p) else "",sep="\t");cat("\n") }; cat("R_LIBS=",paste(.libPaths(),collapse="|"),"\n",sep="")'
          Rscript --vanilla -e 'print(Sys.getenv("R_LIBS_USER")); print(.libPaths()); cat("OK\n")'
          python -c "import tempfile; from pathlib import Path; from native_dist.environment import inspect_r, r_candidates; root=Path(tempfile.mkdtemp()); print('rscript', r_candidates(root)[:2]); print(inspect_r(Path(r'C:\R\bin\Rscript.EXE'), root))"
