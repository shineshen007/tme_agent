name: Debug R user library

on: push

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Probe short and repository user libraries
        shell: pwsh
        run: |
          $short = Join-Path $env:RUNNER_TEMP "Rlib"
          $long = Join-Path $env:RUNNER_WORKSPACE "tme_agent\tme_agent\.pytest-tmp\test_inspect_r_includes_user_l0\R-library"
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          New-Item -ItemType Directory -Force -Path $long | Out-Null
          foreach ($dir in @($short, $long)) {
            Write-Host "user library: $dir"
            $env:R_LIBS_USER = $dir
            Rscript --vanilla -e 'cat("R_VERSION=",as.character(getRversion()),"\n",sep="")'
            python -c "from pathlib import Path; from native_dist.environment import inspect_r; print(inspect_r(Path(r'C:\R\bin\Rscript.EXE'), Path(r'D:\a\tme_agent\tme_agent')))"
          }
