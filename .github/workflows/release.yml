name: Publish public release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install synthetic RDS inspection dependency
        run: Rscript -e 'install.packages(c("jsonlite", "digest"), repos="https://cloud.r-project.org")'
      - run: python -m pip install -r native_dist/requirements-native.txt
      - run: python -m native_dist.public_release audit
      - run: python -m pytest -q
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build tag-matched data-free assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m native_dist.public_release build --expected-version "$RELEASE_TAG" --output dist
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/manifest-*.json dist/SHA256SUMS-*.txt --verify-tag --title "tme_agent $RELEASE_TAG" --notes-file CHANGELOG.md --latest
