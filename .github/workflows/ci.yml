name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Install synthetic RDS inspection dependency
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: python -m pip install -r native_dist/requirements-native.txt
      - run: python -m native_dist.public_release audit
      - run: python -m pytest -q
      - run: python -m native_dist.public_release build --output dist
      # Portable tests do not claim native R/sandbox or system-vault acceptance.
